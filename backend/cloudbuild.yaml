# Build the API image with Cloud Build and push to Artifact Registry.
# Replace the placeholders:
#   {{GCP_PROJECT_ID}}   e.g. my-product-123456
#   {{GCP_REGION}}       e.g. asia-northeast1   (a region that supports Cloud Run domain mapping)
#   {{AR_REPO}}          Artifact Registry repository name, e.g. my-product
#   {{SERVICE_NAME}}     image/service name, e.g. api-development
#
# Run with:  gcloud builds submit --config cloudbuild.yaml
serviceAccount: projects/{{GCP_PROJECT_ID}}/serviceAccounts/deployer@{{GCP_PROJECT_ID}}.iam.gserviceaccount.com
logsBucket: gs://{{GCP_PROJECT_ID}}-cloudbuild/logs

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - {{GCP_REGION}}-docker.pkg.dev/{{GCP_PROJECT_ID}}/{{AR_REPO}}/{{SERVICE_NAME}}:latest
      - .

images:
  - {{GCP_REGION}}-docker.pkg.dev/{{GCP_PROJECT_ID}}/{{AR_REPO}}/{{SERVICE_NAME}}:latest
