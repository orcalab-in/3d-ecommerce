[project]
name = "printforge"
version = "0.1.0"
description = "Model-generation engine for an automated 3D-print gifting business"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dem = ["rasterio>=1.3"]
geo = ["shapely>=2.0"]
fonts = ["fonttools>=4.0"]
test = ["pytest>=7.0"]
all = ["rasterio>=1.3", "shapely>=2.0", "fonttools>=4.0", "pytest>=7.0"]

[project.scripts]
printforge = "printforge.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["printforge*"]

[tool.setuptools.package-data]
printforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
